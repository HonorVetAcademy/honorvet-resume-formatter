services:
  - type: web
    name: honorvet-resume-formatter-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://honorvetacademy.github.io/honorvet-resume-formatter
      - key: UPLOAD_DIR
        value: ./uploads
